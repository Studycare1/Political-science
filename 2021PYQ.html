const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const progressEl = document.getElementById('progress');
const LABELS = ['a','b','c','d'];
let submitted = false;
let answeredSet = new Set();   // किन प्रश्नों का उत्तर दिया जा चुका है

function render(){
  submitted = false;
  answeredSet = new Set();
  resultEl.style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
  quizEl.innerHTML = '';
  DATA.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card' + i;
    let html = `<div class="q">${i+1}. ${d[0]}</div>`;
    d[1].forEach((o, j) => {
      html += `<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}">(${LABELS[j]}) ${o}</label>`;
    });
    html += `<div class="reason" id="r${i}"></div>`;
    card.innerHTML = html;
    quizEl.appendChild(card);
  });
  updateProgress();
  window.scrollTo({top:0});
}

function updateProgress(){
  progressEl.textContent = answeredSet.size + '/' + DATA.length;
}

// एक प्रश्न का उत्तर तुरंत जाँचकर हरा/लाल रंग दिखाना
function revealOne(i, chosen){
  const d = DATA[i];
  const card = document.getElementById('card' + i);
  const opts = card.querySelectorAll('.opt');
  const ans = [].concat(d[2]);

  card.classList.add('locked');
  opts.forEach(o => {
    o.querySelector('input').disabled = true;
    o.classList.remove('selected');
  });
  ans.forEach(k => opts[k].classList.add('correct'));           // सही उत्तर हमेशा हरा
  if (!ans.includes(chosen)) opts[chosen].classList.add('wrong'); // गलत चुना तो लाल

  const r = document.getElementById('r' + i);
  r.innerHTML = '<b>कारण:</b> ' + d[3] +
    (d[4] ? '<div class="warn">⚠ इस उत्तर को अपनी पुस्तक की उत्तर-कुंजी से मिला लें।</div>' : '');
  r.classList.add('show');

  answeredSet.add(i);
  updateProgress();
}

// क्लिक करते ही तुरंत फीडबैक
quizEl.addEventListener('change', e => {
  if (submitted) return;
  const lab = e.target.closest('.opt');
  if (!lab) return;
  const i = +lab.dataset.q;
  if (answeredSet.has(i)) return;      // एक बार उत्तर देने के बाद बदल नहीं सकते
  revealOne(i, +e.target.value);
});

function submitQuiz(){
  if (submitted) return;
  const left = DATA.length - answeredSet.size;
  if (left > 0 && !confirm(left + ' प्रश्न बाकी हैं। फिर भी Submit करें?')) return;

  submitted = true;
  let score = 0, wrong = 0, skipped = 0;

  DATA.forEach((d, i) => {
    const card = document.getElementById('card' + i);
    const opts = card.querySelectorAll('.opt');
    const chosen = card.querySelector('input:checked');
    const c = chosen ? +chosen.value : -1;
    const ans = [].concat(d[2]);

    // जो प्रश्न छूट गए, Submit पर उनका भी सही उत्तर दिखा दें
    if (!answeredSet.has(i)) {
      card.classList.add('locked');
      opts.forEach(o => { o.querySelector('input').disabled = true; o.classList.remove('selected'); });
      ans.forEach(k => opts[k].classList.add('correct'));
      const r = document.getElementById('r' + i);
      r.innerHTML = '<b>कारण:</b> ' + d[3] +
        (d[4] ? '<div class="warn">⚠ इस उत्तर को अपनी पुस्तक की उत्तर-कुंजी से मिला लें।</div>' : '');
      r.classList.add('show');
      answeredSet.add(i);
    }

    if (ans.includes(c)) score++;
    else if (c === -1) skipped++;
    else wrong++;
  });

  updateProgress();

  const pct = Math.round(score / DATA.length * 100);
  resultEl.innerHTML = `<h2>${score} / ${DATA.length} (${pct}%)</h2>✅ सही: ${score} &nbsp; ❌ गलत: ${wrong} &nbsp; ⏭ छोड़े: ${skipped}`;
  resultEl.style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('resetBtn').addEventListener('click', render);
document.getElementById('sb').innerHTML = SB.map((x,i)=>`<details><summary>${i+1}. ${x[0]}</summary><p>${x[1]}</p></details>`).join('');
render();
</script>
</body>
</html>
